name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install PDF text and OCR tools used by tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Format
        run: cargo fmt --check
      - name: No new warnings in this crate
        # Only this crate's files (src/, tests/) are gated; git dependencies may warn.
        run: |
          cargo build --all-targets --locked --message-format=short 2>&1 | tee build.log
          if grep -E '^(src|tests)/.*warning' build.log; then echo "::error::remarkable-server has compiler warnings"; exit 1; fi
      - name: Test
        run: cargo test --workspace --all-targets --locked
