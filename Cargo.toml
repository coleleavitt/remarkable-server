[package]
name = "remarkable-server"
version = "0.1.0"
edition = "2021"
description = "Local reMarkable sync server"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32c = "0.6"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

# Cloud and integration dependencies
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
urlencoding = "2"

# Feed sync dependencies
feed-rs = "2"
readability = "0.3"
epub-builder = "0.7"
imap = "3.0.0-alpha.15"
native-tls = "0.2"
mailparse = "0.15"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }

# Utilities
tempfile = "3"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.45", features = ["aws-lc-rs"] }
tiny-skia = "0.11"
rumqttc = { version = "0.24", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
bytes = "1"
remarkable-lines = { version = "0.1.0", path = "../remarkable/crates/remarkable-lines" }
remarkable-core = { version = "0.1.0", path = "../remarkable/crates/remarkable-core" }
# Screen share viewer: protocol/transport core and signaling message types
remarkable-screenshare = { path = "../remarkable/crates/remarkable-screenshare" }
remarkable-mqtt = { path = "../remarkable/crates/remarkable-mqtt" }
png = "0.17"
regex = "1.13.1"
tokio-util = { version = "0.7.19", features = ["io"] }
diffy = "0.5.2"

[dev-dependencies]
tokio-test = "0.4"
# Fake tablet peer for the screen share viewer test
webrtc = { git = "https://github.com/coleleavitt/webrtc", branch = "fix/datachannel-max-message-size" }
flate2 = "1"
proptest = "1.11.0"

# MQTT broker for device notifications

[features]
# Statically link OpenSSL (for cross-compiling to hosts with a different libssl)
vendored-openssl = ["native-tls/vendored"]
