[package]
name = "remarkable-server"
version = "0.1.0"
edition = "2021"
description = "Local reMarkable sync server"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32c = "0.6"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "9"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# Cloud and integration dependencies
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
urlencoding = "2"

# Feed sync dependencies
feed-rs = "2"
readability = "0.3"
epub-builder = "0.7"
imap = "3.0.0-alpha.15"
native-tls = "0.2"
mailparse = "0.15"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }

# Utilities
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"
