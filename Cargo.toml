[package]
name = "remarkable-server"
version = "0.1.0"
edition = "2021"
description = "Local reMarkable sync server"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
crc32c = "0.6"
base64 = "0.22"
hex = "0.4"
# HMAC only (HS256/HS512), so no PEM parsing and no RustCrypto backend: its `rust_crypto`
# feature pulls `rsa` (RUSTSEC-2023-0071, no fix). aws-lc-rs is already here via rustls.
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

# Cloud and integration dependencies
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
urlencoding = "2"

# Feed sync dependencies
feed-rs = "2"
# Readability.js port for /feeds/v1/extract, run on HTML we already fetched (no HTTP client of
# its own). Replaces `readability` 0.3, whose default reqwest 0.11 feature pulled h2 0.3
# (RUSTSEC-2026-0258) and rustls-pemfile 1 (unmaintained).
dom_smoothie = "0.18.2"
# dom_smoothie's DOM (same version it uses, no new crate): feeds.rs checks nesting depth and
# resolves URLs on it before and after extraction.
dom_query = "0.28"
epub-builder = "0.7"
imap = "3.0.0-alpha.15"
native-tls = "0.2"
mailparse = "0.15"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }

# Utilities
tempfile = "3"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.45", features = ["aws-lc-rs"] }
tiny-skia = "0.11"
# Only the mqttbytes v4 codec is used (src/screenshare.rs), so no features are needed here.
# Keep rumqttc's rustls features off everywhere (they pull rustls-webpki 0.102): in the
# resolved build remarkable-mqtt enables only `use-native-tls` (feature unification).
rumqttc = { version = "0.25.1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
bytes = "1"
remarkable-lines = { version = "0.1.0", git = "https://github.com/coleleavitt/remarkable-rs", rev = "0eb11cf5ce2cfd0414f6273a486b1fa0e87e3476" }
remarkable-core = { version = "0.1.0", git = "https://github.com/coleleavitt/remarkable-rs", rev = "0eb11cf5ce2cfd0414f6273a486b1fa0e87e3476" }
# Screen share viewer: protocol/transport core and signaling message types
remarkable-screenshare = { git = "https://github.com/coleleavitt/remarkable-rs", rev = "0eb11cf5ce2cfd0414f6273a486b1fa0e87e3476" }
remarkable-mqtt = { git = "https://github.com/coleleavitt/remarkable-rs", rev = "0eb11cf5ce2cfd0414f6273a486b1fa0e87e3476" }
png = "0.17"
regex = "1.13.1"
tokio-util = { version = "0.7.19", features = ["io"] }
diffy = "0.5.2"
# CalDAV multistatus parsing (already in the tree via feed-rs, so no new crate)
quick-xml = "0.41"

[dev-dependencies]
# Paused clock (`start_paused`, `time::advance`) for deadline tests; same tokio, no new crate
tokio = { version = "1", features = ["test-util"] }
tokio-test = "0.4"
# WebSocket client for the /mqtt route test (same version axum's ws uses)
tokio-tungstenite = "0.29"
# Fake tablet peer for the screen share viewer test. Needs
# SettingEngine::set_sctp_max_message_size_can_receive (the tablet's frames are
# >64 KiB): webrtc-rs/webrtc#908, merged into upstream's v0.17.x branch as this
# rev but not yet released (crates.io has 0.17.2). Pinned to the same rev as
# remarkable-screenshare so the tree has one webrtc; a `branch = "v0.17.x"`
# spec is a different git source to cargo and would duplicate every webrtc
# crate. Switch both to crates.io webrtc = "0.17.3" (or later 0.17.x) once
# published.
webrtc = { git = "https://github.com/webrtc-rs/webrtc", rev = "98d0a140d2f0a49d7ebd10feabaee18931941630" }
flate2 = "1"
proptest = "1.11.0"

# MQTT broker for device notifications

[features]
# Statically link OpenSSL (for cross-compiling to hosts with a different libssl)
vendored-openssl = ["native-tls/vendored"]
