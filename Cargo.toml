[package]
name = "remarkable-server"
version = "0.1.0"
edition = "2021"
description = "Local reMarkable sync server"
license = "MIT"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto/hashing
sha2 = "0.10"
crc32c = "0.6"
base64 = "0.22"
hex = "0.4"

# Utilities


tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"

# Local crates (optional, for type reuse)
# remarkable-sync = { path = "../remarkable/crates/remarkable-sync" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio-test = "0.4"
