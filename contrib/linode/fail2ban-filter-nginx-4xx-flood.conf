# /etc/fail2ban/filter.d/nginx-4xx-flood.conf
# Any 401/403/404 - only bans at high volume (see jail maxretry). The tablet produces
# at most ~2 401s per 10 min (token refresh), so the threshold of 40 is far above that.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[^"]*" (401|403|404) 
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
