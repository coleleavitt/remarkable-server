# /etc/nginx/snippets/block-probes.conf
# Drop common vulnerability-scanner probes without a response (444 = close connection).
# Include inside every server {} block:   include snippets/block-probes.conf;
# /.well-known/ is deliberately excluded (ACME, mta-sts, etc.).
# The 444 lines are what the fail2ban `nginx-probe` jail bans on.
location ~* ^/\.(?!well-known/) { access_log /var/log/nginx/access.log; return 444; }
location ~* (\.(php\d?|phtml|asp|aspx|jsp|cgi|env|ini|sql|bak|old|swp)$|/wp-(admin|login|includes|content|json)|/phpmyadmin|/pma/|/xmlrpc|/cgi-bin/|/vendor/phpunit|/actuator|/boaform|/HNAP1|/owa/|/autodiscover/|/solr/|/geoserver) { return 444; }
