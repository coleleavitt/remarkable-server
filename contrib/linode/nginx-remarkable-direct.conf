# Approach B (direct, no tablet proxy): the tablet's /etc/hosts points the
# reMarkable cloud hostnames straight at this server's public IP. nginx presents
# the self-signed *.remarkable.com cert from certs/server.crt, which the tablet
# trusts because our CA is installed on it. Nothing else on the internet trusts
# that cert, so only a tablet set up this way can use it.
# Requires the `map $connection_upgrade` block from the approach A file (define it once).
# Screenshare doesn't work in this mode: the tablet dials the broker on :443,
# which nginx's HTTP server owns. Use approach A if you need screenshare.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name .remarkable.com .remarkable.engineering *.appspot.com;

    ssl_certificate     /etc/remarkable-server/tls/rm-selfsigned.crt;
    ssl_certificate_key /etc/remarkable-server/tls/rm-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tablet uploads whole notebooks/PDFs in one request.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # Notifications use a long-lived WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
