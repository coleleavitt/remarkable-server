# Approach A (tablet proxy): the tablet runs rm-proxy, which relays to this host
# over TLS verified against a normal Let's Encrypt cert.
# Install: /etc/nginx/sites-available/remarkable.unwrap.rs  (+ symlink in sites-enabled)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name remarkable.unwrap.rs;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remarkable.unwrap.rs;

    ssl_certificate     /etc/letsencrypt/live/remarkable.unwrap.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remarkable.unwrap.rs/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tablet uploads whole notebooks/PDFs in one request.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # Notifications use a long-lived WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
